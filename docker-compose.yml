services:
  # One PostgreSQL database for the whole system, pulled from Docker Hub.
  # Port 5433 on your machine maps to 5432 inside the container.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - store_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d   # 01-schema.sql then 02-seed.sql, first start only

  product-service:
    build: ./product-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      - postgres
    restart: on-failure

  inventory-service:
    build: ./inventory-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      - postgres
    restart: on-failure

  order-service:
    build: ./order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVICES_PRODUCT_URL: http://product-service:8080
      SERVICES_INVENTORY_URL: http://inventory-service:8082
    depends_on:
      - postgres
      - product-service
      - inventory-service
    restart: on-failure

  cart-service:
    build: ./cart-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVICES_ORDER_URL: http://order-service:8081
    depends_on:
      - postgres
      - order-service
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - product-service
      - inventory-service
      - order-service
      - cart-service

volumes:
  store_data:
