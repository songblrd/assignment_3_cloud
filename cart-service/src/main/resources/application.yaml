server:
  port: 8083

spring:
  application:
    name: cart-service
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev

app:
  cors:
    allowed-origin: http://localhost:3000

services:
  order:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true

info:
  app:
    name: Cart Management Service
    version: 1.0.0
    author: Aaron Sieunarine