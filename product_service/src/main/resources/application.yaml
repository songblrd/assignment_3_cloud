server:
  port: 8080

spring:
  application:
    name: inventory-management-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev
  
warehouse:
  name: Northfield Distribution Warehouse
  location: Waterloo Fulfillment Center

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true

info:
  app:
    name: Inventory Management Service
    version: 1.0.0
    author: Marianne Moyo