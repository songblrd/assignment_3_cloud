server:
  port: 8080

spring:
  application:
    name: product-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev
  
app:
  cors:
    allowed-origin: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true

info:
  app:
    name: Product Service
    version: 1.0.0
    author: Marianne Moyo